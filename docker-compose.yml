services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finpilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-finpilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-finpilot_user} -d $${POSTGRES_DB:-finpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-finpilot-backend}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://finpilot_user:finpilot_password@postgres:5432/finpilot_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-super-secret-key-12345}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
